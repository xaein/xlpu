<div id="databasecontrolroweditDialog" class="dialog dialog-hidden">
    <div class="dialog-content">
        <div class="app-name-label">Edit Application:</div>
        <div class="input-container">
            <div class="input-row">
                <button id="selectFileButton" class="select-file-button">Select File</button>
                <div class="input-fields">
                    <div class="input-field">
                        <label for="appNameInput">Name:</label>
                        <input type="text" id="appNameInput" placeholder="Enter app name">
                    </div>
                    <div class="input-field">
                        <label for="appCmdInput">Command:</label>
                        <input type="text" id="appCmdInput" placeholder="Enter command">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="dialog-footer">
        <button class="ok-button">OK</button>
        <button class="close-button">Cancel</button>
    </div>
</div>
