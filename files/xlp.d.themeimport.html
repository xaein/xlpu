<div id="themeImportDialog" class="dialog dialog-hidden">
    <div class="dialog-content">
        <div class="app-name-label">Theme Import:</div>
        <div class="input-container">
            <div class="input-row">
                <div class="input-fields">
                    <div class="input-field">
                        <input type="text" id="themeImportPath" readonly>
                    </div>
                </div>
            </div>
            <button class="select-file-button" id="selectThemeFile">Select Theme File</button>
        </div>
    </div>
    <div class="dialog-footer">
        <button class="ok-button">Import</button>
        <button class="close-button">Cancel</button>
    </div>
</div>
