<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline';">
    <meta name="description" content="xLauncher Plus - A Node.js Electron-based app launcher">
    <meta name="author" content="Xaein Daei">
    <title>xLauncher Plus</title>
    <link rel="stylesheet" href="themes/compiled/base.universal.css">
    <link rel="stylesheet" href="themes/compiled/header.css">
    <link rel="stylesheet" href="themes/compiled/footer.css">
    <link rel="stylesheet" href="themes/compiled/edit.config.css">
    <link rel="icon" href="icon/xlauncherplus.ico" type="image/x-icon">
</head>
<body>
    <div id="headerContainer"></div>
    <div id="mainContent">
        <div class="config-content">
            <div class="config-nav-container">
                <div class="config-nav">
                    <ul id="configList">
                        <li data-config="general" class="config-item">General</li>
                        <li data-config="triggercmd" class="config-item" style="display: none;">TriggerCMD</li>
                        <li data-config="update" class="config-item">Update</li>
                    </ul>
                </div>
            </div>
            <div class="config-details">
                <div id="configDisplay"></div>
            </div>
        </div>
    </div>
    <div id="bottomWrapper">
        <div id="footerContainer" class="footer-container"></div>
    </div>
    <div id="dialogContainer"></div>

    <script>
        // Global initialization
        // Sets up the js.F object for common functions
        let js = { F: {} };
        window.js = js;

        // Handle script loading
        // Loads common functions and initializes configuration page functionality
        async function handleScriptLoad(scriptName, success) {
            if (success && typeof window.commonFunctions !== 'undefined') {
                js.F = { ...window.commonFunctions };

                try {
                    const variables = js.F.getData('xldbv') || {};
                    const scriptsToLoad = variables.loadScripts || [];
                    const scriptDir = variables.directories?.scripts || 'script';

                    await Promise.all(scriptsToLoad.map(script => {
                        const fullPath = `${scriptDir}/${script}`;
                        return js.F.lazyLoadScript(fullPath);
                    }));

                    js.F.updateJsF();
                    initializePage();

                } catch (error) {}
            }
        }
    </script>

    <script src="script/common.js" onload="handleScriptLoad('common', true)" onerror="handleScriptLoad('common', false)" defer></script>

    <script>
        // Configuration state variables
        // Stores original configurations for comparison
        let originalGeneralConfig = {};
        let originalTriggerCmdConfig = {};
        let originalUpdateConfig = {};

        let currentSection = null;
        let pendingSection = null;

        // Page initialization
        // Sets up the configuration page by loading components and initializing handlers
        async function initializePage() {
            window.xldbv = js.F.getData('xldbv');
            window.xldbf = js.F.getData('xldbf') || {};
            window.tempData = js.F.getData('tempData');
            
            // Directory references
            const includesDir = js.F.dirVar('includes');
            const scriptDir = js.F.dirVar('scripts');
            
            await js.F.lazyLoadScript(`${scriptDir}/configuration.js`);
            await js.F.lazyLoadScript(`${scriptDir}/updater.js`);
            js.F.updateJsF();

            Promise.all([
                fetch(`${includesDir}/header.html`).then(response => response.text()),
                fetch(`${includesDir}/footer.html`).then(response => response.text()),
                fetchConfigSections()
            ]).then(async ([headerHtml, footerHtml, sections]) => {
                document.getElementById('headerContainer').innerHTML = headerHtml;
                document.getElementById('footerContainer').innerHTML = footerHtml;
                window.configSections = sections;

                await new Promise(resolve => setTimeout(resolve, 100));

                js.F.setupHeaderNavigation('configuration');
                js.F.setupFooterButtons('configuration');
                
                const saveButton = document.getElementById('footerLeftButton');
                if (saveButton) {
                    saveButton.onclick = async () => {
                        await js.F.showDialog('configSave', currentSection);
                        const result = await saveConfiguration();
                        if (result) {
                            js.F.updateSaveButtonState();
                            setTimeout(() => {
                                js.F.closeDialog('configSave');
                            }, 5000);
                        } else {
                            js.F.closeDialog('configSave');
                        }
                    };
                }

                await js.F.loadRowSelectors();
                await js.F.setupConfigList();
                setupConfigListHandlers();
                
                js.F.setupConfigChangeListener();
                
                await handleSectionChange('general');
            });
        }

        // Configuration section management
        // Fetches and loads HTML content for each configuration section
        async function fetchConfigSections() {
            try {
                const includesDir = js.F.dirVar('includes');
                const dialogDir = js.F.dirVar('includes', 'dialog');
                
                const [generalHtml, triggercmdHtml, updateHtml] = await Promise.all([
                    fetch(`${includesDir}/configcon.g.html`).then(response => response.text()),
                    fetch(`${includesDir}/configcon.t.html`).then(response => response.text()),
                    fetch(`${includesDir}/configcon.u.html`).then(response => response.text())
                ]);
                return {
                    general: generalHtml,
                    triggercmd: triggercmdHtml,
                    update: updateHtml
                };
            } catch (error) {
                console.error('Error loading config sections:', error);
                return {};
            }
        }

        // Section change handling
        // Manages the transition between different configuration sections
        async function handleSectionChange(newSection) {
            if (currentSection === newSection) return;

            if (hasUnsavedChanges()) {
                pendingSection = newSection;
                await js.F.showDialog('configConfirm', currentSection);
            } else {
                js.F.loadConfigSection(newSection);
            }
        }

        // Unsaved changes handling
        // Manages user actions when there are unsaved configuration changes
        function handleUnsavedChanges(action) {
            if (action === 'save') {
                saveConfiguration(true)
                    .then((result) => {
                        if (result) {
                            saveOriginalConfig(currentSection);
                            js.F.loadConfigSection(pendingSection);
                        }
                        js.F.closeDialog('configConfirm');
                    })
                    .catch(error => {
                        js.F.closeDialog('configConfirm');
                    });
            } else if (action === 'discard') {
                // Reset currentSectionTemp to original state based on section
                switch (currentSection) {
                    case 'general':
                        window.currentSectionTemp.xlaunchConfig = { ...js.F.getData('xlaunchConfig') };
                        window.currentSectionTemp.theme = {
                            favourite: window.xldbv.configOpts.theme.favourite,
                            rowSelector: window.xldbv.configOpts.theme.rowSelector,
                            rowWidth: window.xldbv.configOpts.theme.rowWidth
                        };
                        window.currentSectionTemp.system = { ...window.xldbv.configOpts.system };
                        break;
                    case 'triggercmd':
                        window.currentSectionTemp.triggercmd = { ...window.xldbv.configOpts.triggercmd };
                        break;
                    case 'update':
                        window.currentSectionTemp.updates = { ...window.xldbv.configOpts.updates };
                        break;
                }
                js.F.loadConfigSection(pendingSection);
                js.F.closeDialog('configConfirm');
            }
        }

        // Original configuration backup
        // Creates a deep copy of the current configuration for comparison
        function saveOriginalConfig(section) {
            const config = js.F.getConfig(section);
            switch (section) {
                case 'general':
                    originalGeneralConfig = JSON.parse(JSON.stringify(config));
                    break;
                case 'triggercmd':
                    originalTriggerCmdConfig = JSON.parse(JSON.stringify(config));
                    break;
                case 'update':
                    originalUpdateConfig = JSON.parse(JSON.stringify(config));
                    break;
            }
        }
        
        // Deep object comparison
        // Performs a recursive comparison between two configuration objects
        function isEqual(obj1, obj2) {
            const keys1 = Object.keys(obj1).sort();
            const keys2 = Object.keys(obj2).sort();

            if (keys1.length !== keys2.length) {
                return false;
            }

            for (let i = 0; i < keys1.length; i++) {
                const key = keys1[i];
                if (key !== keys2[i] || obj1[key] !== obj2[key]) {
                    return false;
                }
            }

            return true;
        }

        // Unsaved changes detection
        // Checks if the current configuration differs from the original
        function hasUnsavedChanges() {
            if (!currentSection) return false;

            try {
                switch (currentSection) {
                    case 'general': {
                        const origLogging = js.F.getData('xlaunchConfig');
                        if (origLogging && window.currentSectionTemp?.xlaunchConfig) {
                            const loggingEqual = Object.keys(origLogging).every(key => {
                                return origLogging[key] === window.currentSectionTemp.xlaunchConfig[key];
                            });
                            if (!loggingEqual) return true;
                        }

                        const tempTheme = window.currentSectionTemp?.theme;
                        const origTheme = window.xldbv?.configOpts?.theme;
                        if (tempTheme && origTheme) {
                            const themeEqual = Object.keys(tempTheme).every(key => {
                                return tempTheme[key] === origTheme[key];
                            });
                            if (!themeEqual) return true;
                        }

                        const tempSystem = window.currentSectionTemp?.system || {};
                        const origSystem = window.xldbv?.configOpts?.system || {};
                        
                        const systemDifferent = 
                            (tempSystem.show ?? false) !== (origSystem.show ?? false) ||
                            (tempSystem.minimizeTo ?? false) !== (origSystem.minimizeTo ?? false) ||
                            (tempSystem.closeTo ?? false) !== (origSystem.closeTo ?? false) ||
                            (tempSystem.startWithWindows ?? false) !== (origSystem.startWithWindows ?? false) ||
                            (tempSystem.startMinimized ?? false) !== (origSystem.startMinimized ?? false);
                        
                        if (systemDifferent) {
                            return true;
                        }
                        
                        return false;
                    }
                    case 'triggercmd': {
                        const tempTrigger = window.currentSectionTemp?.triggercmd;
                        const origTrigger = window.xldbv?.configOpts?.triggercmd;
                        
                        if (tempTrigger && origTrigger) {
                            return !Object.keys(tempTrigger).every(key => 
                                tempTrigger[key] === origTrigger[key]
                            );
                        }
                        return false;
                    }
                    case 'update': {
                        const tempUpdates = window.currentSectionTemp?.updates;
                        const origUpdates = window.xldbv?.configOpts?.updates;
                        
                        if (tempUpdates && origUpdates) {
                            return tempUpdates.autoCheck !== origUpdates.autoCheck ||
                                   tempUpdates.periodic.enable !== origUpdates.periodic.enable ||
                                   tempUpdates.periodic.interval !== origUpdates.periodic.interval;
                        }
                        return false;
                    }
                    default:
                        return false;
                }
            } catch (error) {
                return false;
            }
        }

        // Update save button state
        // Controls save button enabled state based on configuration changes
        function updateSaveButtonState() {
            const saveButton = document.getElementById('footerLeftButton');
            if (saveButton) {
                const isDifferent = hasUnsavedChanges();
                saveButton.disabled = !isDifferent;
                saveButton.classList.toggle('disabled', !isDifferent);
            }
        }

        // Save configuration
        // Saves and processes all configuration changes across different sections
        async function saveConfiguration(skipDialog = false) {
            const promises = [];

            switch (currentSection) {
                case 'general': {
                    if (window.currentSectionTemp.system) {
                        const systemConfig = window.currentSectionTemp.system;
                        if (systemConfig.show !== window.xldbv.configOpts.system.show) {
                            promises.push(e.Api.invoke('update-tray-visibility', systemConfig.show));
                        }
                        if (systemConfig.startWithWindows !== window.xldbv.configOpts.system.startWithWindows) {
                            promises.push(js.F.handleStartupShortcut(systemConfig.startWithWindows));
                        }
                    }
                    
                    js.F.setData('xlaunchConfig', window.currentSectionTemp.xlaunchConfig);
                    window.xldbv.configOpts.theme.favourite = window.currentSectionTemp.theme.favourite;
                    window.xldbv.configOpts.theme.rowSelector = window.currentSectionTemp.theme.rowSelector;
                    window.xldbv.configOpts.theme.rowWidth = window.currentSectionTemp.theme.rowWidth;
                    window.xldbv.configOpts.system = { ...window.currentSectionTemp.system };
                    break;
                }
                case 'triggercmd': {
                    window.xldbv.configOpts.triggercmd = { ...window.currentSectionTemp.triggercmd };
                    break;
                }
                case 'update': {
                    window.xldbv.configOpts.updates = { ...window.currentSectionTemp.updates };
                    break;
                }
            }
            
            js.F.setData('xldbv', window.xldbv);
            await js.F.updateVariablesOnExit();
            await Promise.all(promises);
            
            saveOriginalConfig(currentSection);
            js.F.updateSaveButtonState();
            
            if (!skipDialog) {
                await showSaveConfigDialog(currentSection);
            }
            
            return true;
        }

        // Save configuration dialog
        // Displays and manages the configuration save confirmation dialog system
        async function showSaveConfigDialog(section) {
            const dialogElement = document.getElementById('configSave');
            if (!dialogElement || !dialogElement.classList.contains('active')) {
                await js.F.showDialog('configSave', section);
                setTimeout(async () => {
                    await js.F.closeDialog('configSave');
                }, 5000);
            }
        }

        // Setup configuration list handlers
        // This function sets up the event handlers for the configuration list items
        function setupConfigListHandlers() {
            const configItemElements = document.querySelectorAll('.config-item');
            configItemElements.forEach(item => {
                item.addEventListener('click', () => {
                    handleSectionChange(item.dataset.config);
                });
            });

            const firstVisibleItem = Array.from(configItemElements).find(item => item.style.display !== 'none');
            if (firstVisibleItem) {
                firstVisibleItem.click();
            }
        }
    </script>
</body>
</html>
