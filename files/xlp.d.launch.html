<!-- Launch Dialog -->
<div id="launchDialog" class="dialog dialog-hidden">
    <div class="dialog-content">
        <div class="app-name-label">App Launching:</div>
        <div id="appName" class="app-name"></div>
    </div>
    <div class="dialog-footer">
        <div class="countdown">
            <div class="countdown">Closing Dialog</div>
            <div class="countdown" id="countdown">in 5 seconds</div>
        </div>
        <button class="close-button">Close</button>
    </div>
</div>
