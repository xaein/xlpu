<div class="databasecontrol">
    <div id="tabContainer">
        <div id="tabListContainer">
            <div id="tabList" class="tab"></div>
        </div>
    </div>
    <div id="tableContainer" class="table-container">
        <div class="table-header-overlay">
            <div class="header-cell app-column">App</div>
            <div class="header-cell command-column">Launch command</div>
        </div>
        <div class="table-scroll-container">
            <table id="appTable" class="app-table">
                <tbody></tbody>
            </table>
        </div>
    </div>
    <div id="controlPanel">
        <div class="controls-menu">
            <div class="menu-group">
                <span class="menu-label">Category:</span>
                <div class="menu-buttons">
                    <button id="addCategoryButton" class="category-button add-button" title="Add Category">Add</button>
                    <button id="renameCategoryButton" class="category-button rename-button" title="Rename Category" disabled>Rename</button>
                    <button id="removeCategoryButton" class="category-button remove-button" title="Remove Category" disabled>Delete</button>
                </div>
            </div>
            <div class="menu-group">
                <span class="menu-label">Row:</span>
                <div class="menu-buttons">
                    <button id="addRowButton" class="row-button add-button" title="Add Row">Add</button>
                    <button id="editRowButton" class="row-button edit-button" title="Edit Row" disabled>Edit</button>
                    <button id="removeRowButton" class="row-button remove-button" title="Remove Row" disabled>Remove</button>
                </div>
            </div>
        </div>
    </div>
</div>
